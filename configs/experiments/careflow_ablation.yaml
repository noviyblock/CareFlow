# Why is careflow_9b worse than single_9b (0.31 head-to-head, docs/results.md)? Remove one component at a time.
# Same 60 ESConv test contexts and judge as systems_eval; cached calls are reused.
# Run: uv run python scripts/run_experiment.py --config configs/experiments/careflow_ablation.yaml
inherit:
  - ../base.yaml
  - ../compute/local_mps.yaml

experiment:
  name: careflow_ablation
  task: systems_eval

mlflow:
  experiment: careflow-baselines

models_config: configs/models.yaml
judge_role: judge
data: {dataset_dir: data/processed/esconv, split: test, n_contexts: 60, min_history: 4}
judge: {max_tokens: 900}
bootstrap: {n: 1000}

systems:
  single_9b:        {type: single, role: agent}
  careflow_9b:      {type: careflow_mas, role: agent}
  careflow_noctx:   {type: careflow_mas, role: agent, kwargs: {use_context: false}}
  careflow_norisk:  {type: careflow_mas, role: agent, kwargs: {use_risk: false}}
  careflow_nocheck: {type: careflow_mas, role: agent, kwargs: {use_checks: false}}

references: [single_9b]
plot_reference: single_9b
