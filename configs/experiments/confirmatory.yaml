# PRE-REGISTERED confirmatory run (docs/robustness_plan.md, H1-H3). Do not change after launch.
# New sample: ESConv train (not used for training or tuning anywhere), new seed, 250 contexts.
# Analysis is fixed in advance: equivalence task (TOST, LC) on outputs/confirmatory, 3 H1 comparisons.
# Run: uv run python scripts/run_experiment.py --config configs/experiments/confirmatory.yaml
inherit:
  - ../base.yaml
  - ../compute/local_mps.yaml

seed: 20261103
experiment:
  name: confirmatory
  task: systems_eval

mlflow:
  experiment: careflow-confirmatory

prereg_files:
  - docs/robustness_plan.md
  - configs/experiments/confirmatory.yaml
  - configs/experiments/confirmatory_analysis.yaml
  - src/careflow/eval/equivalence.py
  - src/careflow/eval/length_control.py

models_config: configs/models.yaml
judge_role: judge
data: {dataset_dir: data/processed/esconv, split: train, n_contexts: 250, min_history: 4}
embedding_model:
  id: sentence-transformers/all-MiniLM-L6-v2
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
systems:
  single_2b:     {type: single, role: slm}
  single_9b:     {type: single, role: agent}
  rerank_9b:     {type: rerank, role: agent, kwargs: {n: 4, temperature: 0.8}}
  insideout_9b:  {type: insideout, role: agent}
  roundtable_9b: {type: roundtable, role: agent}
  careflow_9b:   {type: careflow_mas, role: agent}
controls:
  ctrl_generic:   {kind: generic, source: single_9b, text: "I'm really sorry you're going through this. I'm here for you."}
  ctrl_truncated: {kind: truncated, source: single_9b}
  ctrl_shuffled:  {kind: shuffled, source: single_9b}
references: [single_9b]
plot_reference: single_9b
judge: {max_tokens: 900}
bootstrap: {n: 1000}
