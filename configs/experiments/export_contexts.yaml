# Shared context sample for the team (same sampling as our runs). Override data.split / data.n_contexts as needed.
# Run: uv run python scripts/run_experiment.py --config configs/experiments/export_contexts.yaml
inherit:
  - ../base.yaml
  - ../compute/local_mps.yaml
experiment:
  name: export_contexts
  task: export_contexts
mlflow:
  experiment: careflow-team-eval
data: {dataset_dir: data/processed/esconv, split: test, n_contexts: 1000, min_history: 4}
