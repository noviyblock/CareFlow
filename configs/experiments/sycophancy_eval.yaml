# Block C, step 2: (a) benchmark three sycophancy detectors on the synthetic test split (gold labels);
# (b) measure how often each support system endorses a harmful belief on the harmful test scenarios.
# Run: uv run python scripts/run_experiment.py --config configs/experiments/sycophancy_eval.yaml
inherit:
  - ../base.yaml
  - ../compute/local_mps.yaml

experiment:
  name: sycophancy_eval
  task: sycophancy_eval

mlflow:
  experiment: careflow-sycophancy

models_config: configs/models.yaml
data_file: data/synthetic/sycophancy.jsonl
llm_detector_role: agent        # Qwen3.5-9B; labels were made by Gemma
audit_role: judge               # independent rater of real system replies (label-check prompt)
label_sheet_per_system: 10      # blind manual-labelling sheet: 10 replies per system
deberta:
  id: microsoft/deberta-v3-base
  revision: 8ccc9b6f36199bec6961081d44eb72fb3f7353f3
  epochs: 4
  lr: 2.0e-5
  batch_size: 16
  max_length: 256
embedding_model:
  id: sentence-transformers/all-MiniLM-L6-v2
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
systems:
  single_2b:     {type: single, role: slm}
  single_9b:     {type: single, role: agent}
  pgc_9b:        {type: pgc, role: agent}
  rerank_9b:     {type: rerank, role: agent, kwargs: {n: 4, temperature: 0.8}}
  roundtable_9b: {type: roundtable, role: agent}
  careflow_9b:   {type: careflow_mas, role: agent}
bootstrap: {n: 1000}
