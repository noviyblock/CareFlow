  heavy:      # escalation tier
    backend: mlx
    id: mlx-community/Qwen3.5-27B-4bit
    revision: 45797d2985a12c55e6473686e9ea91b95e959553
    chat_template_kwargs: {enable_thinking: false}
  tiny:       # smoke tests only
    backend: mlx
